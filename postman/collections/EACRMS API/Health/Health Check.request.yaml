$kind: http-request
name: Health Check
method: GET
url: '{{baseUrl}}/api/v1/health'
order: 1000
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response has status field", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("status");
      });
