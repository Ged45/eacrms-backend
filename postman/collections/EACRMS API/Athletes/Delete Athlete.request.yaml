$kind: http-request
name: Delete Athlete
method: DELETE
url: '{{baseUrl}}/api/v1/athletes/{{athleteId}}'
order: 8000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 204", () => {
        pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });
