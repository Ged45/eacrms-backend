$kind: http-request
name: Suspend Club
method: PATCH
url: '{{baseUrl}}/api/v1/clubs/{{clubId}}/suspend'
order: 8000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
