$kind: http-request
name: Get Athlete Fayda Status
method: GET
url: '{{baseUrl}}/api/v1/athletes/{{athleteId}}/fayda/status'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response has verification status", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("status");
      });
