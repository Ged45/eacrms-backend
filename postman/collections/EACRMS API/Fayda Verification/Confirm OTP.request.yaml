$kind: http-request
name: Confirm OTP
method: POST
url: '{{baseUrl}}/api/v1/fayda/verify/{{verificationId}}/confirm'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "otp": "123456"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Verification confirmed", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("status");
      });
