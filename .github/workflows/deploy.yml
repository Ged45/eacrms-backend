name: Build and Deploy EACRMS Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================================
  # BUILD AND PUSH IMAGE TO GHCR
  # ============================================================

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/eacrms-backend" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest


  # ============================================================
  # DEPLOY TO COMPANY SERVER
  # ============================================================

  deploy:
    needs: build-and-push

    runs-on:
      - self-hosted
      - linux
      - x64
      - eacrms
      - production

    steps:

      - name: Verify self-hosted runner
        run: |
          echo "========================================"
          echo "Self-hosted runner verification"
          echo "========================================"

          echo "Hostname:"
          hostname

          echo "User:"
          whoami

          echo "Working directory:"
          pwd

          echo "Docker:"
          docker --version

          echo "Docker Compose:"
          docker compose version

      - name: Deploy EACRMS
        working-directory: /var/www/eacrms-backend
        run: |
          set -e

          echo "========================================"
          echo "Deploying EACRMS Backend"
          echo "========================================"

          IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Image:"
          echo "$IMAGE"

          echo "Logging into GitHub Container Registry..."

          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ secrets.GHCR_USERNAME }}" \
            --password-stdin

          echo "Pulling Docker image..."

          docker pull "$IMAGE"

          echo "Updating deployment..."

          export EACRMS_IMAGE="$IMAGE"

          docker compose \
            -f docker-compose.prod.yml \
            up -d \
            --remove-orphans

          echo "Cleaning unused Docker images..."

          docker image prune -f

          echo "Checking containers..."

          docker compose \
            -f docker-compose.prod.yml \
            ps

          echo "========================================"
          echo "Deployment completed"
          echo "========================================"


      - name: Check application logs
        if: always()
        working-directory: /var/www/eacrms-backend
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            logs \
            --tail=50 \
            app


      - name: Health check
        working-directory: /var/www/eacrms-backend
        run: |
          echo "Waiting for application..."

          sleep 10

          echo "Testing API..."

          curl --fail \
            --max-time 10 \
            http://127.0.0.1:5000/api/v1/health

          echo ""
          echo "Health check passed!"