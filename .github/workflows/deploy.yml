name: Build and Deploy EACRMS Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/eacrms-backend

jobs:

  # ============================================================
  # BUILD AND PUSH
  # ============================================================

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Set lowercase image name
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/eacrms-backend"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest


  # ============================================================
  # DEPLOY TO COMPANY SERVER
  # ============================================================

  deploy:
    needs: build-and-push

    runs-on:
      - self-hosted
      - linux
      - x64
      - eacrms
      - production

    steps:

      # --------------------------------------------------------
      # Verify runner
      # --------------------------------------------------------

      - name: Verify self-hosted runner
        run: |
          echo "========================================"
          echo "EACRMS Self-Hosted Runner"
          echo "========================================"

          echo "Hostname:"
          hostname

          echo "User:"
          whoami

          echo "IP addresses:"
          hostname -I

          echo "Docker:"
          docker --version

          echo "Docker Compose:"
          docker compose version

          echo "========================================"


      # --------------------------------------------------------
      # Deploy
      # --------------------------------------------------------

      - name: Deploy EACRMS Backend
        working-directory: /var/www/eacrms-backend
        run: |
          set -e

          echo "========================================"
          echo "Deploying EACRMS Backend"
          echo "========================================"

          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/eacrms-backend"
          IMAGE_TAG="${{ github.sha }}"

          echo "IMAGE_NAME=$IMAGE_NAME"
          echo "IMAGE_TAG=$IMAGE_TAG"

          echo "Logging into GitHub Container Registry..."

          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ secrets.GHCR_USERNAME }}" \
            --password-stdin

          echo "Pulling image..."

          docker pull "$IMAGE_NAME:$IMAGE_TAG"

          echo "Starting deployment..."

          export IMAGE_NAME="$IMAGE_NAME"
          export IMAGE_TAG="$IMAGE_TAG"

          docker compose \
            -f docker-compose.prod.yml \
            up -d \
            --remove-orphans

          echo "Deployment started."


      # --------------------------------------------------------
      # Check containers
      # --------------------------------------------------------

      - name: Check containers
        working-directory: /var/www/eacrms-backend
        run: |
          echo "========================================"
          echo "Container Status"
          echo "========================================"

          docker compose \
            -f docker-compose.prod.yml \
            ps


      # --------------------------------------------------------
      # Show application logs
      # --------------------------------------------------------

      - name: Check application logs
        if: always()
        working-directory: /var/www/eacrms-backend
        run: |
          echo "========================================"
          echo "Application Logs"
          echo "========================================"

          docker compose \
            -f docker-compose.prod.yml \
            logs \
            --tail=50 \
            app


      # --------------------------------------------------------
      # Health check
      # --------------------------------------------------------

      - name: Health check
        working-directory: /var/www/eacrms-backend
        run: |
          set -e

          echo "Waiting for application to start..."

          sleep 10

          echo "Testing API..."

          curl \
            --fail \
            --max-time 10 \
            http://127.0.0.1:5000/api/v1/health

          echo ""
          echo "========================================"
          echo "Health check PASSED"
          echo "========================================"


      # --------------------------------------------------------
      # Cleanup
      # --------------------------------------------------------

      - name: Cleanup old Docker images
        if: success()
        run: |
          docker image prune -f

          echo "========================================"
          echo "Deployment completed successfully"
          echo "========================================"