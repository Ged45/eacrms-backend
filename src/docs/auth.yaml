paths:
  /auth/register:
  post:
    tags: [Auth]
    summary: Register a new user
    description: Creates a new user account with ATHLETE role. Status starts as PENDING.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterRequest'
    responses:
      '201':
        description: User registered successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: User registered successfully. }
                data:
                  $ref: '#/components/schemas/UserPublic'
      '400':
        description: Validation failed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationError'
      '409':
        description: Email already exists
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

  /auth/login:
  post:
    tags: [Auth]
    summary: Login
    description: Authenticates a user and returns access + refresh tokens. Account must be ACTIVE.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
          example:
            email: admin@eacrms.local
            password: ChangeMe123!
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginResponse'
      '400':
        description: Invalid credentials or account not active
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

  /auth/me:
  get:
    tags: [Auth]
    summary: Get current user
    description: Returns the authenticated user's profile, roles, and permissions.
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Current user profile
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                data:
                  allOf:
                    - $ref: '#/components/schemas/UserPublic'
                    - type: object
                      properties:
                        roles:
                          type: array
                          items: { type: string }
                          example: [SUPER_ADMIN]
                        permissions:
                          type: array
                          items: { type: string }
                          example: [athlete:view, athlete:delete]
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

  /auth/logout:
  post:
    tags: [Auth]
    summary: Logout
    description: Stateless logout — client should discard the token.
    security: []
    responses:
      '200':
        description: Logged out successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: Logged out successfully. }

  /auth/forgot-password:
  post:
    tags: [Auth]
    summary: Forgot password
    description: >
      Sends a 6-digit verification code to the user's email or phone.
      Provide one of: `identifier`, `email`, or `phoneNumber`.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              identifier:
                type: string
                description: Email or phone number (auto-resolved)
                example: user@example.com
              email:
                type: string
                format: email
                example: user@example.com
              phoneNumber:
                type: string
                example: "+251911234567"
            anyOf:
              - required: [identifier]
              - required: [email]
              - required: [phoneNumber]
    responses:
      '200':
        description: Verification code sent
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Verification code sent successfully." }
      '400':
        description: Validation failed or user not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

  /auth/reset-password:
  post:
    tags: [Auth]
    summary: Reset password
    description: >
      Resets the user's password using the 6-digit code sent via forgot-password.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [identifier, code, newPassword]
            properties:
              identifier:
                type: string
                description: Email or phone number
                example: user@example.com
              code:
                type: string
                description: 6-digit verification code
                example: "123456"
              newPassword:
                type: string
                description: New password (min 8 characters)
                example: "NewSecurePass123!"
    responses:
      '200':
        description: Password reset successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success: { type: boolean, example: true }
                message: { type: string, example: "Password reset successfully." }
      '400':
        description: Invalid code or validation failed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

  /auth/refresh:
  post:
    tags: [Auth]
    summary: Refresh token
    description: Not yet implemented.
    security: []
    responses:
      '501':
        description: Not implemented
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
